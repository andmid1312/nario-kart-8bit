<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Retro Spel-Byggare</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090e;color:#fff;font-family:'Courier New',Courier,monospace;min-height:100vh;padding:10px}
h1{color:#ffcc00;text-shadow:3px 3px #000;text-align:center;font-size:clamp(16px,3vw,24px);margin-bottom:8px}
.sub{text-align:center;color:#888;font-size:12px;margin-bottom:12px}
.shell{max-width:1100px;margin:0 auto;border:4px solid #ffcc00;border-radius:10px;background:#0b0e14;
box-shadow:0 0 24px rgba(255,204,0,.3);display:grid;grid-template-columns:1fr 1fr;min-height:70vh;overflow:hidden}
@media(max-width:800px){.shell{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;min-height:420px}
.pane-h{background:#151922;border-bottom:2px solid #ffcc00;padding:8px 12px;font-weight:bold;color:#ffcc00}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.35;white-space:pre-wrap}
.msg.bot{background:#1a2233;border:2px solid #445;align-self:flex-start}
.msg.user{background:#3d2a00;border:2px solid #ffcc00;align-self:flex-end}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.choice{background:#222;border:2px solid #fff;color:#fff;font-family:inherit;font-size:12px;padding:6px 10px;cursor:pointer}
.choice:hover,.choice:active{background:#ffcc00;color:#000}
#composer{display:flex;gap:6px;padding:8px;border-top:2px solid #333}
#composer input{flex:1;background:#151922;border:2px solid #555;color:#fff;padding:8px;font-family:inherit}
#composer button{background:#ffcc00;color:#000;border:0;font-weight:bold;padding:8px 12px;font-family:inherit;cursor:pointer}
.right{border-left:2px solid #333}
#preview-wrap{flex:1;display:flex;flex-direction:column;background:#000}
#preview{flex:1;width:100%;border:0;background:#000;min-height:260px}
#code-wrap{display:none;flex:1;overflow:auto;background:#0a0a12}
#code{width:100%;height:100%;min-height:260px;background:#0a0a12;color:#9f9;border:0;padding:8px;font-size:10px;font-family:Consolas,monospace}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-top:2px solid #333;background:#151922}
.toolbar button{background:#222;border:2px solid #fff;color:#fff;font-family:inherit;font-size:12px;padding:8px 10px;cursor:pointer;font-weight:bold}
.toolbar button:hover{background:#ffcc00;color:#000}
.toolbar button.primary{background:#2ecc71;color:#000;border-color:#fff}
.toolbar button:disabled{opacity:.4;cursor:default}
#status{font-size:11px;color:#888;padding:0 8px 8px}
</style>
</head>
<body>
<h1>🕹️ RETRO SPEL-BYGGARE</h1>
<p class="sub">Chatta fram ett retrospel · lokal mallmotor · ingen AI-nyckel · ladda ner HTML</p>
<div class="shell">
  <div class="pane">
    <div class="pane-h">CHAT</div>
    <div id="chat"></div>
    <div id="composer">
      <input id="inp" type="text" placeholder="Skriv svar..." maxlength="40">
      <button type="button" id="send">SKICKA</button>
    </div>
  </div>
  <div class="pane right">
    <div class="pane-h">GENERERAT SPEL</div>
    <div id="preview-wrap">
      <iframe id="preview" sandbox="allow-scripts" title="Förhandsgranskning"></iframe>
      <div id="code-wrap"><textarea id="code" readonly></textarea></div>
    </div>
    <div class="toolbar">
      <button type="button" class="primary" id="btn-dl" disabled>⬇ Ladda ner</button>
      <button type="button" id="btn-prev" disabled>▶ Förhandsgranska</button>
      <button type="button" id="btn-code" disabled>{} Kod</button>
      <button type="button" id="btn-open" disabled>⧉ Öppna</button>
      <button type="button" id="btn-reset">↺ Börja om</button>
    </div>
    <div id="status">Välj typ i chatten för att börja.</div>
  </div>
</div>

n d.got})){X.fillStyle='rgba(0,0,0,0.55)';X.fillRect(0,0,640,360);X.fillStyle='#2ecc71';X.font='28px Courier New';X.fillText('BANAN KLAR!',230,180)}\n  requestAnimationFrame(loop);\n}\nloop();\n})();\n<\/script></body></html>", "board": "<!DOCTYPE html>\n<html lang=\"sv\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>{{TITLE}}</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}body{background:#07090e;color:#fff;font-family:Courier New,monospace;display:flex;flex-direction:column;align-items:center;padding:10px}\nh1{color:#ffcc00;text-shadow:2px 2px #000;font-size:18px;margin-bottom:8px}\n#board{display:grid;grid-template-columns:repeat(8,40px);gap:4px;border:4px solid #ffcc00;padding:10px;background:{{BG}}}\n.cell{width:40px;height:40px;background:#151922;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}\n.cell.start{border-color:#ffcc00}.cell.goal{border-color:#2ecc71}.cell.trap{border-color:#e74c3c}\n.btn{margin-top:10px;background:#ffcc00;color:#000;border:0;padding:10px 18px;font-weight:bold;font-family:inherit;cursor:pointer}\n#log{margin-top:8px;color:#0fc;min-height:40px;text-align:center;font-size:13px}\n</style></head><body>\n<h1>{{TITLE}}</h1>\n<div id=\"board\"></div>\n<button class=\"btn\" id=\"roll\">SLÅ TÄRNING</button>\n<div id=\"log\">Hjälp {{PLAYER}} till målet! Undvik fällor.</div>\n<script>\n(function(){\nvar path=[0,1,2,3,11,19,27,35,43,51,59,58,57,56,48,40,32,24,16,8,9,10,18,26,34,42,50,49,41,33];\nvar traps={3:1,19:1,35:1,56:1,24:1},goal=path[path.length-1];\nvar pos=0,name={{PLAYER_JS}},color={{COLOR_JS}};\nvar board=document.getElementById('board');\nfor(var i=0;i<64;i++){var d=document.createElement('div');d.className='cell';d.id='c'+i;board.appendChild(d)}\nfunction draw(){\n  for(var i=0;i<64;i++){var el=document.getElementById('c'+i);el.textContent='';el.style.background='#151922';\n    if(path.indexOf(i)>=0)   {id:"breakout", label:"Brickor / Breakout", desc:"Racket + boll + brickor"},
  {id:"pong", label:"Pong", desc:"Klassisk racket-duell"},
  {id:"maze", label:"Labyrint", desc:"Pac-stil: punkter & spöken"},
  {id:"board", label:"Brädspel", desc:"Tärning längs en bana"}
];
var COLORS = [
  {id:"#e67e22", label:"Orange (Benny)"},
  {id:"#e74c3c", label:"Röd"},
  {id:"#2ecc71", label:"Grön"},
  {id:"#3498db", label:"Blå"},
  {id:"#9b59b6", label:"Lila"},
  {id:"#f1c40f", label:"Gul"}
];

var state = {step:"type", type:null, theme:null, player:"Benny", color:"#e67e22", html:""};
var chat = document.getElementById("chat");
var inp = document.getElementById("inp");
var blobUrl = null;

function bot(text, choices) {
  var d = document.createElement("div");
  d.className = "msg bot";
  d.textContent = text;
  if (choices && choices.length) {
    var row = document.createElement("div");
    row.className = "choices";
    choices.forEach(function(c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      b.textContent = c.label;
      b.onclick = function() { pick(c); };
      row.appendChild(b);
    });
    d.appendChild(row);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function user(text) {
  var d = document.createElement("div");
  d.className = "msg user";
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function pick(c) {
  if (state.step === "type") {
    user(c.label);
    state.type = c.id;
    state.step = "theme";
    var th = Object.keys(THEMES).map(function(k){ return {id:k, label:THEMES[k].label}; });
    bot("Snyggt! Vilket tema ska världen ha?", th);
  } else if (state.step === "theme") {
    user(c.label);
    state.theme = c.id;
    state.step = "color";
    bot("Vilken färg ska hjälten ha?", COLORS);
  } else if (state.step === "color") {
    user(c.label);
    state.color = c.id;
    state.step = "name";
    bot("Vad heter spelaren? Skriv ett namn (t.ex. Benny4real) och tryck SKICKA.", null);
    inp.focus();
  }
}

function fill(tpl) {
  var th = THEMES[state.theme] || THEMES.neon;
  var title = (TYPES.filter(function(t){return t.id===state.type})[0]||{}).label || "Retrospel";
  title = title + ": " + state.player;
  var html = tpl;
  html = html.split("{{TITLE}}").join(title);
  html = html.split("{{PLAYER}}").join(state.player);
  html = html.split("{{PLAYER_JS}}").join(JSON.stringify(state.player));
  html = html.split("{{COLOR}}").join(state.color);
  html = html.split("{{COLOR_JS}}").join(JSON.stringify(state.color));
  html = html.split("{{THEME}}").join(state.theme);
  html = html.split("{{THEME_JS}}").join(JSON.stringify(state.theme));
  html = html.split("{{BG}}").join(th.bg);
  html = html.split("{{BG_JS}}").join(JSON.stringify(th.bg));
  html = html.split("{{ACCENT}}").join(th.accent);
  html = html.split("{{ACCENT_JS}}").join(JSON.stringify(th.accent));
  return html;
}

function generate() {
  var tpl = TEMPLATES[state.type];
  if (!tpl) { bot("Okänd mall.", null); return; }
  try {
    state.html = fill(tpl);
    document.getElementById("code").value = state.html;
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(new Blob([state.html], {type:"text/html"}));
    var prev = document.getElementById("preview");
    prev.src = blobUrl;
    document.getElementById("preview-wrap").style.display = "flex";
    document.getElementById("code-wrap").style.display = "none";
    ["btn-dl","btn-prev","btn-code","btn-open"].forEach(function(id){ document.getElementById(id).disabled = false; });
    document.getElementById("status").textContent = "Klart! " + state.type + " · " + state.player + " · " + (THEMES[state.theme]||{}).label;
    bot("✅ Spelet är genererat! Använd knapparna till höger: Förhandsgranska, Ladda ner eller Öppna.\nSkriv 'ny' för att bygga ett till.", null);
    state.step = "done";
  } catch (e) {
    bot("Fel vid generering: " + e.message, null);
    console.error(e);
  }
}

function submitName() {
  var v = (inp.value || "").trim() || "Benny";
  inp.value = "";
  if (state.step === "done" && /^ny$/i.test(v)) { reset(); return; }
  if (state.step !== "name") {
    if (/^ny$/i.test(v)) reset();
    return;
  }
  user(v);
  state.player = v.slice(0, 20);
  bot("Genererar " + state.type + " åt " + state.player + "...", null);
  setTimeout(generate, 200);
}

function reset() {
  state = {step:"type", type:null, theme:null, player:"Benny", color:"#e67e22", html:""};
  chat.innerHTML = "";
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  document.getElementById("preview").src = "about:blank";
  document.getElementById("code").value = "";
  ["btn-dl","btn-prev","btn-code","btn-open"].forEach(function(id){ document.getElementById(id).disabled = true; });
  document.getElementById("status").textContent = "Välj typ i chatten för att börja.";
  start();
}

function start() {
  bot("Hej! Jag är en lokal mallmotor (ingen moln-AI). Vilken typ av retrospel vill du bygga?", TYPES.map(function(t){
    return {id:t.id, label:t.label + " — " + t.desc};
  }));
}

document.getElementById("send").onclick = submitName;
inp.onkeydown = function(e){ if(e.key==="Enter") submitName(); };
document.getElementById("btn-reset").onclick = reset;
document.getElementById("btn-dl").onclick = function(){
  if(!state.html)return;
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([state.html],{type:"text/html"}));
  a.download=(state.type||"retro")+"-"+state.player+".html";
  a.click();
};
document.getElementById("btn-prev").onclick = function(){
  document.getElementById("code-wrap").style.display="none";
  document.getElementById("preview").style.display="block";
  if(blobUrl) document.getElementById("preview").src=blobUrl;
};
document.getElementById("btn-code").onclick = function(){
  document.getElementById("preview").style.display="none";
  document.getElementById("code-wrap").style.display="block";
};
document.getElementById("btn-open").onclick = function(){
  if(blobUrl) window.open(blobUrl, "_blank");
};

try { start(); }
catch(e){ document.getElementById("status").textContent = "Fel: "+e.message; }
</script>
</body>
</html>
